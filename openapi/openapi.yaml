openapi: 3.0.3

info:
  title: Marketplace API
  version: 1.0.0
  description: API for an Allegro-like marketplace with products, orders, payments, and inventory control.

servers:
  - url: http://localhost:3000
    description: Local development server

security: []

paths:
  /products:
    get:
      operationId: listProducts
      summary: List products
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of products to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: Opaque pagination token from the previous response. Clients must not parse it.
          schema:
            type: string
      responses:
        "200":
          description: Product list returned successfully
          content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductListResponse"

  /products/{product_id}:
    get:
      operationId: getProductById
      summary: Get product by id
      parameters:
        - name: product_id
          in: path
          required: true
          description: Product identifier.
          schema:
            type: string
      responses:
        "200":
          description: Product returned successfully

  /orders:
    get:
      operationId: listOrders
      summary: List orders
      responses:
        "200":
          description: Order list returned successfully
    post:
      operationId: createOrder
      summary: Create order
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: >
            Unique key for safe retries. If the same key is used with the same
            request body, the API returns the same response instead of creating
            a duplicate order.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order created successfully

  /orders/{order_id}:
    get:
      operationId: getOrderById
      summary: Get order by id
      parameters:
        - name: order_id
          in: path
          required: true
          description: Order identifier.
          schema:
            type: string
      responses:
        "200":
          description: Order returned successfully

components:
  schemas:
    Product:
      type: object
      required:
        - id
        - seller_id
        - title
        - price_cents
        - status
      properties:
        id:
          type: string
        seller_id:
          type: string
        title:
          type: string
        description:
          type: string
        price_cents:
          type: integer
        status:
          type: string
          enum:
            - active
            - hidden
            - blocked

    Order:
      type: object
      required:
        - id
        - customer_id
        - status
        - total_cents
        - items
      properties:
        id:
          type: string
        customer_id:
          type: string
        status:
          type: string
          enum:
            - pending
            - paid
            - cancelled
        total_cents:
          type: integer
          example: 5298
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"

    OrderItem:
      type: object
      required:
        - product_id
        - quantity
        - price_cents
      properties:
        product_id:
          type: string
        quantity:
          type: integer
          minimum: 1
        price_cents:
          type: integer

    CreateOrderRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - product_id
              - quantity
            properties:
              product_id:
                type: string
              quantity:
                type: integer
                minimum: 1

    ProductListResponse:
      type: object
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        next_cursor:
          type: string
          nullable: true
          description: Opaque token for the next page. Null means there are no more pages.
